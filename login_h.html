<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>लॉगिन - अटेंडेंस सिस्टम</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-bg">
  <div class="auth-container">
    <div class="auth-card">
      <h2>लॉगिन</h2>
      <form id="loginForm">
        <label for="userid">मोबाइल नंबर या यूजर आईडी</label>
        <input type="text" id="userid" name="userid" required />

        <label for="password">पासवर्ड</label>
        <input type="password" id="password" name="password" required />

        <button type="submit" class="login-btn">लॉगिन</button>
        <button type="button" class="otp-btn">ओटीपी से लॉगिन करें</button>
      </form>
      <div class="auth-links">
        <a href="forgot.html">पासवर्ड भूल गए?</a>
      </div>
    </div>
  </div>
  <footer class="site-footer">
    &copy; 2025 टीम StrategIQ — स्मार्ट इंडिया हैकाथॉन | <a href="help.html">सहायता और समर्थन</a>
  </footer>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = 'loggedin.html';
    });
  </script>
</body>
</html>
