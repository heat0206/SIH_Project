<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>लॉगिन - StrategIQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="main-header">
    <div class="nav-left">
      <a href="index.html" class="logo">
        <img src="logo.jpg" alt="StrategIQ Logo" style="height:64px; width:auto; display:block;">
      </a>
      <nav class="main-nav">
        <a href="index.html" class="nav-link active">डैशबोर्ड</a>
        <a href="reports.html" class="nav-link admin-only">रिपोर्ट</a>
      </nav>
    </div>
    <div class="nav-right">
      <div class="lang-switch">
        <a href="index.html">English</a> | <a href="login_h.html" class="active">हिन्दी</a>
      </div>
    </div>
  </header>

  <main class="dashboard-main">
    <div class="auth-container">
      <div class="auth-card">
        <h2>लॉगिन</h2>
        <form id="loginForm">
          <label for="userid">मोबाइल नंबर या यूज़र आईडी</label>
          <input type="text" id="userid" name="userid" required />

          <label for="password">पासवर्ड</label>
          <input type="password" id="password" name="password" required />

          <button type="submit" class="login-btn">लॉगिन</button>
          <button type="button" class="otp-btn">ओटीपी से लॉगिन करें</button>
        </form>
        <div class="auth-links">
          <a href="forgot.html">पासवर्ड भूल गए?</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    &copy; 2025 टीम StrategIQ — स्मार्ट इंडिया हैकथॉन | <a href="help.html">सहायता और समर्थन</a>
  </footer>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = 'loggedin_h.html';
    });
  </script>
</body>
</html>
